<svg xmlns="http://www.w3.org/2000/svg" width="470" height="500" viewBox="0 0 470 500" font-family="Helvetica, Arial, sans-serif">
<rect width="470" height="500" fill="#ffffff"/>
<text x="20" y="28" font-size="15" fill="#111827" text-anchor="start" font-weight="bold">Base joint - enlarged section</text><text x="20" y="46" font-size="10.5" fill="#4b5563" text-anchor="start" font-weight="normal">Mechanical. No magnet, no glue, and nothing sticking out underneath.</text><line x1="20" y1="58" x2="450" y2="58" stroke="#e5e7eb"/>
<rect x="90.00" y="326.00" width="78.00" height="24.00" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.0"/><text x="171.0" y="343.28" font-size="10" fill="#1d4ed8" text-anchor="start" font-weight="normal">wall A finger</text><rect x="90.00" y="302.00" width="78.00" height="24.00" fill="#fca5a5" stroke="#991b1b" stroke-width="1.0"/><text x="171.0" y="319.28" font-size="10" fill="#991b1b" text-anchor="start" font-weight="bold">base plate corner tab</text><rect x="90.00" y="278.00" width="78.00" height="24.00" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.0"/><text x="171.0" y="295.28" font-size="10" fill="#1d4ed8" text-anchor="start" font-weight="normal">wall A finger</text><rect x="90.00" y="254.00" width="78.00" height="24.00" fill="#e5e7eb" stroke="#4b5563" stroke-width="1.0"/><text x="171.0" y="271.28" font-size="10" fill="#4b5563" text-anchor="start" font-weight="normal">wall B finger</text><rect x="90.00" y="230.00" width="78.00" height="24.00" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.0"/><text x="171.0" y="247.28" font-size="10" fill="#1d4ed8" text-anchor="start" font-weight="normal">wall A finger</text><rect x="168.00" y="302.00" width="72.00" height="24.00" fill="#fca5a5" stroke="#991b1b" stroke-width="1.0"/><text x="171.0" y="319.28" font-size="10" fill="#991b1b" text-anchor="start" font-weight="normal">base plate</text><line x1="70.0" y1="350.0" x2="246.0" y2="350.0" stroke="#111827" stroke-width="1.6"/><text x="68.0" y="366.0" font-size="10" fill="#111827" text-anchor="end" font-weight="normal">floor</text><text x="90.0" y="366.0" font-size="10" fill="#15803d" text-anchor="start" font-weight="normal">the walls run right down to here, so the case sits flat</text><text x="20" y="400" font-size="10" fill="#4b5563" text-anchor="start" font-weight="normal">Band 1 belongs to the side walls. Band 2 is left empty, and the base</text><text x="20" y="418" font-size="10" fill="#4b5563" text-anchor="start" font-weight="normal">plate's corner tab drops into it. Band 3 belongs to the front and back</text><text x="20" y="436" font-size="10" fill="#4b5563" text-anchor="start" font-weight="normal">walls. So the tab is boxed in above, below and on both sides - it can</text><text x="20" y="454" font-size="10" fill="#4b5563" text-anchor="start" font-weight="normal">neither slide nor drop, and nothing protrudes below the floor.</text><text x="20" y="486" font-size="9.5" fill="#9aa0ae" text-anchor="start" font-weight="normal">The base sits one finger band up, so the underside is a flat rim.</text>
</svg>
