<svg xmlns="http://www.w3.org/2000/svg" width="460" height="360" viewBox="0 0 460 360" font-family="Helvetica, Arial, sans-serif">
<rect width="460" height="360" fill="#ffffff"/>
<text x="20" y="28" font-size="15" fill="#111827" text-anchor="start" font-weight="bold">Base joint - enlarged section</text><text x="20" y="46" font-size="10.5" fill="#4b5563" text-anchor="start" font-weight="normal">Mechanical. No magnet, no glue. This is what holds the floor in.</text><line x1="20" y1="58" x2="440" y2="58" stroke="#e5e7eb"/>
<rect x="70.00" y="130.00" width="276.00" height="48.00" fill="#eef2f9" stroke="#111827" stroke-width="0.8"/><rect x="166.00" y="-146.00" width="48.00" height="276.00" fill="#f7f9fd" stroke="#111827" stroke-width="0.8"/><rect x="166.00" y="130.00" width="48.00" height="48.00" fill="#fca5a5" stroke="#991b1b" stroke-width="1.2"/><rect x="166.00" y="178.00" width="156.00" height="18.00" fill="#fca5a5" stroke="#991b1b" stroke-width="1.2"/><line x1="166.0" y1="-146.0" x2="166.0" y2="196.0" stroke="#b91c1c" stroke-width="1" stroke-dasharray="4 3"/><text x="174.0" y="-110.0" font-size="10" fill="#4b5563" text-anchor="start" font-weight="normal">wall</text><text x="74.0" y="174.0" font-size="10" fill="#4b5563" text-anchor="start" font-weight="normal">base plate</text><text x="172.0" y="222.0" font-size="10" fill="#b91c1c" text-anchor="start" font-weight="normal">26 mm head, 3 mm below the base</text><text x="20" y="300" font-size="10" fill="#4b5563" text-anchor="start" font-weight="normal">The wall's own material is cut as an L-shaped hook. It drops through a</text><text x="20" y="318" font-size="10" fill="#4b5563" text-anchor="start" font-weight="normal">keyhole slot in the base plate: 26 mm wide at the entry, only 9 mm wide</text><text x="20" y="336" font-size="10" fill="#4b5563" text-anchor="start" font-weight="normal">where the neck ends up. The wall's slide is the assembly motion, so the</text><text x="20" y="354" font-size="10" fill="#4b5563" text-anchor="start" font-weight="normal">head ends up trapped under solid acrylic and cannot pull back up.</text><text x="20" y="346" font-size="9.5" fill="#9aa0ae" text-anchor="start" font-weight="normal">The head sits 3 mm below the base plate, flush with a 3 mm felt pad.</text>
</svg>
