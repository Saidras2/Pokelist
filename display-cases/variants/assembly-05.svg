<text x="20" y="28" font-size="15" fill="#111827" text-anchor="start" font-weight="bold">STEP 5 &#183; Base down, side walls on</text><text x="20" y="46" font-size="10.5" fill="#4b5563" text-anchor="start" font-weight="normal">The base is not magnetic. It is keyed, and the walls lock it.</text><line x1="20" y1="58" x2="380" y2="58" stroke="#e5e7eb"/>
