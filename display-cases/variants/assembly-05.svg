ill="#f7f9fd" stroke="#111827" stroke-width="0.8" stroke-linejoin="round"/><text x="24" y="300" font-size="9.5" fill="#4b5563" text-anchor="start" font-weight="normal">Base plate flat on the bench. Four corner notches (red)</text><text x="24" y="316" font-size="9.5" fill="#4b5563" text-anchor="start" font-weight="normal">and four keyhole slots (amber). Then the two side walls</text><text x="24" y="332" font-size="9.5" fill="#4b5563" text-anchor="start" font-weight="normal">drop onto it, inside the notches.</text><text x="24" y="350" font-size="9.5" fill="#15803d" text-anchor="start" font-weight="normal">The base cannot move sideways: the notches lock it.</text><text x="20" y="386" font-size="9.5" fill="#9aa0ae" text-anchor="start" font-weight="normal">Cut the keyhole slots in the same laser pass as everything else.</text>
