.5" fill="#15803d" text-anchor="start" font-weight="normal">dropping, the walls above stop it rising.</text><text x="20" y="386" font-size="9.5" fill="#9aa0ae" text-anchor="start" font-weight="normal">Check both diagonals are equal before going on.</text>
