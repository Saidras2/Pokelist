<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" font-family="Helvetica, Arial, sans-serif">
<rect width="400" height="400" fill="#ffffff"/>
<text x="20" y="28" font-size="15" fill="#111827" text-anchor="start" font-weight="bold">STEP 4 &#183; Bond the lid and base magnets</text><text x="20" y="46" font-size="10.5" fill="#4b5563" text-anchor="start" font-weight="normal">8 more magnets, at the matching positions on both plates.</text><line x1="20" y1="58" x2="380" y2="58" stroke="#e5e7eb"/>
<polygon points="322.20,102.00 244.17,147.05 244.17,140.25 322.20,95.20" fill="#dde5f2" stroke="#111827" stroke-width="0.8" stroke-linejoin="round"/><polygon points="121.97,76.50 244.17,147.05 244.17,140.25 121.97,69.70" fill="#cbd6ea" stroke="#111827" stroke-width="0.8" stroke-linejoin="round"/><polygon points="200.00,24.65 322.20,95.20 244.17,140.25 121.97,69.70" fill="#f7f9fd" stroke="#111827" stroke-width="0.8" stroke-linejoin="round"/><polygon points="322.20,274.55 244.17,319.60 244.17,312.80 322.20,267.75" fill="#cfd8e8" stroke="#111827" stroke-width="0.8" stroke-linejoin="round"/><polygon points="121.97,249.05 244.17,319.60 244.17,312.80 121.97,242.25" fill="#bcc7db" stroke="#111827" stroke-width="0.8" stroke-linejoin="round"/><polygon points="200.00,197.20 322.20,267.75 244.17,312.80 121.97,242.25" fill="#eef2f9" stroke="#111827" stroke-width="0.8" stroke-linejoin="round"/><circle cx="261.1" cy="234.2" r="3.2" fill="#b91c1c" stroke="#7f1d1d" stroke-width="0.9"/><circle cx="261.1" cy="65.0" r="3.2" fill="#b91c1c" stroke="#7f1d1d" stroke-width="0.9"/><circle cx="183.1" cy="279.2" r="3.2" fill="#b91c1c" stroke="#7f1d1d" stroke-width="0.9"/><circle cx="183.1" cy="110.1" r="3.2" fill="#b91c1c" stroke="#7f1d1d" stroke-width="0.9"/><circle cx="161.0" cy="221.4" r="3.2" fill="#b91c1c" stroke="#7f1d1d" stroke-width="0.9"/><circle cx="161.0" cy="52.3" r="3.2" fill="#b91c1c" stroke="#7f1d1d" stroke-width="0.9"/><circle cx="283.2" cy="292.0" r="3.2" fill="#b91c1c" stroke="#7f1d1d" stroke-width="0.9"/><circle cx="283.2" cy="122.8" r="3.2" fill="#b91c1c" stroke="#7f1d1d" stroke-width="0.9"/><text x="24" y="330" font-size="9.5" fill="#4b5563" text-anchor="start" font-weight="normal">The same four positions on both flat plates.</text><text x="24" y="346" font-size="9.5" fill="#4b5563" text-anchor="start" font-weight="normal">Offer them dry and let the wall magnets pull each</text><text x="24" y="362" font-size="9.5" fill="#15803d" text-anchor="start" font-weight="normal">one round the right way. That solves polarity.</text><text x="20" y="386" font-size="9.5" fill="#9aa0ae" text-anchor="start" font-weight="normal">Work on a non-magnetic surface - spare magnets chip when they snap.</text>
</svg>
