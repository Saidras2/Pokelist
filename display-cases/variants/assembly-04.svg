<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" font-family="Helvetica, Arial, sans-serif">
<rect width="400" height="400" fill="#ffffff"/>
<text x="20" y="28" font-size="15" fill="#111827" text-anchor="start" font-weight="bold">STEP 4 &#183; Bond the 4 lid magnets</text><text x="20" y="46" font-size="10.5" fill="#4b5563" text-anchor="start" font-weight="normal">8 magnets in the whole case, and every one of them is at the top.</text><line x1="20" y1="58" x2="380" y2="58" stroke="#e5e7eb"/>
<polygon points="315.01,95.20 241.57,137.60 241.57,131.20 315.01,88.80" fill="#dde5f2" stroke="#111827" stroke-width="0.8" stroke-linejoin="round"/><polygon points="126.56,71.20 241.57,137.60 241.57,131.20 126.56,64.80" fill="#cbd6ea" stroke="#111827" stroke-width="0.8" stroke-linejoin="round"/><polygon points="200.00,22.40 315.01,88.80 241.57,131.20 126.56,64.80" fill="#f7f9fd" stroke="#111827" stroke-width="0.8" stroke-linejoin="round"/><polygon points="315.01,266.40 241.57,308.80 241.57,302.40 315.01,260.00" fill="#cfd8e8" stroke="#111827" stroke-width="0.8" stroke-linejoin="round"/><polygon points="126.56,242.40 241.57,308.80 241.57,302.40 126.56,236.00" fill="#bcc7db" stroke="#111827" stroke-width="0.8" stroke-linejoin="round"/><polygon points="200.00,193.60 315.01,260.00 241.57,302.40 126.56,236.00" fill="#eef2f9" stroke="#111827" stroke-width="0.8" stroke-linejoin="round"/><circle cx="257.5" cy="60.4" r="3.2" fill="#b91c1c" stroke="#7f1d1d" stroke-width="0.9"/><circle cx="184.1" cy="102.8" r="3.2" fill="#b91c1c" stroke="#7f1d1d" stroke-width="0.9"/><circle cx="163.3" cy="48.4" r="3.2" fill="#b91c1c" stroke="#7f1d1d" stroke-width="0.9"/><circle cx="278.3" cy="114.8" r="3.2" fill="#b91c1c" stroke="#7f1d1d" stroke-width="0.9"/><text x="24" y="322" font-size="9.5" fill="#4b5563" text-anchor="start" font-weight="normal">Four magnets in the lid plate, at the matching points.</text><text x="24" y="338" font-size="9.5" fill="#4b5563" text-anchor="start" font-weight="normal">Offer them up dry and let the wall magnets pull each one</text><text x="24" y="354" font-size="9.5" fill="#15803d" text-anchor="start" font-weight="normal">round the right way before you glue. Polarity solved.</text><text x="20" y="386" font-size="9.5" fill="#9aa0ae" text-anchor="start" font-weight="normal">Work on a non-magnetic surface - spare magnets chip when they snap.</text>
</svg>
