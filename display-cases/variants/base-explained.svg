<svg xmlns="http://www.w3.org/2000/svg" width="960" height="448" viewBox="0 0 960 448" font-family="Helvetica, Arial, sans-serif">
<rect width="960" height="448" fill="#ffffff"/>
<text x="20" y="28" font-size="15" fill="#111827" text-anchor="start" font-weight="bold">The base joint, from scratch</text><text x="20" y="46" font-size="10.5" fill="#4b5563" text-anchor="start" font-weight="normal">Forget hooks and keyholes. It is a shelf slotted into a gap in the corner joinery.</text><line x1="20" y1="58" x2="940" y2="58" stroke="#e5e7eb"/>
<text x="30.0" y="96" font-size="12" fill="#111827" text-anchor="start" font-weight="bold">1. The corner is a stack</text><line x1="16" y1="320.0" x2="180.0" y2="320.0" stroke="#111827" stroke-width="1.6"/><text x="12.0" y="336.0" font-size="9.5" fill="#4b5563" text-anchor="end" font-weight="normal">floor</text><rect x="30.00" y="300.00" width="46.00" height="20.00" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.0"/><rect x="30.00" y="280.00" width="46.00" height="20.00" fill="#e5e7eb" stroke="#4b5563" stroke-width="1.0"/><rect x="30.00" y="260.00" width="46.00" height="20.00" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.0"/><rect x="30.00" y="240.00" width="46.00" height="20.00" fill="#e5e7eb" stroke="#4b5563" stroke-width="1.0"/><rect x="30.00" y="220.00" width="46.00" height="20.00" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.0"/><rect x="30.00" y="200.00" width="46.00" height="20.00" fill="#e5e7eb" stroke="#4b5563" stroke-width="1.0"/><rect x="30.00" y="180.00" width="46.00" height="20.00" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.0"/><text x="30.0" y="342.0" font-size="9.5" fill="#4b5563" text-anchor="start" font-weight="normal">Fingers interlock up each corner,</text><text x="260.0" y="96" font-size="12" fill="#111827" text-anchor="start" font-weight="bold">2. Leave one band empty</text><line x1="246" y1="320.0" x2="410.0" y2="320.0" stroke="#111827" stroke-width="1.6"/><rect x="260.00" y="300.00" width="46.00" height="20.00" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.0"/><rect x="260.00" y="280.00" width="46.00" height="20.00" fill="#ffffff" stroke="#9aa0ae" stroke-width="1.0" stroke-dasharray="4 3"/><rect x="260.00" y="260.00" width="46.00" height="20.00" fill="#e5e7eb" stroke="#4b5563" stroke-width="1.0"/><rect x="260.00" y="240.00" width="46.00" height="20.00" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.0"/><rect x="260.00" y="220.00" width="46.00" height="20.00" fill="#e5e7eb" stroke="#4b5563" stroke-width="1.0"/><rect x="260.00" y="200.00" width="46.00" height="20.00" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.0"/><rect x="260.00" y="180.00" width="46.00" height="20.00" fill="#e5e7eb" stroke="#4b5563" stroke-width="1.0"/><text x="260.0" y="342.0" font-size="9.5" fill="#4b5563" text-anchor="start" font-weight="normal">Take one block out of the stack.</text><text x="490.0" y="96" font-size="12" fill="#111827" text-anchor="start" font-weight="bold">3. Slide the tab in</text><line x1="476" y1="320.0" x2="640.0" y2="320.0" stroke="#111827" stroke-width="1.6"/><rect x="490.00" y="300.00" width="46.00" height="20.00" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.0"/><rect x="490.00" y="280.00" width="46.00" height="20.00" fill="#ffffff" stroke="#9aa0ae" stroke-width="1.0" stroke-dasharray="4 3"/><rect x="490.00" y="260.00" width="46.00" height="20.00" fill="#e5e7eb" stroke="#4b5563" stroke-width="1.0"/><rect x="490.00" y="240.00" width="46.00" height="20.00" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.0"/><rect x="490.00" y="220.00" width="46.00" height="20.00" fill="#e5e7eb" stroke="#4b5563" stroke-width="1.0"/><rect x="490.00" y="200.00" width="46.00" height="20.00" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.0"/><rect x="490.00" y="180.00" width="46.00" height="20.00" fill="#e5e7eb" stroke="#4b5563" stroke-width="1.0"/><text x="490.0" y="342.0" font-size="9.5" fill="#4b5563" text-anchor="start" font-weight="normal">The base plate's corner tab is</text><rect x="606.00" y="280.00" width="34.00" height="20.00" fill="#fca5a5" stroke="#991b1b" stroke-width="1.1"/><rect x="640.00" y="280.00" width="22.00" height="20.00" fill="#fca5a5" stroke="#991b1b" stroke-width="1.1"/><line x1="602.00" y1="290.00" x2="549.00" y2="290.00" stroke="#991b1b" stroke-width="1.6"/><polygon points="542.00,290.00 549.00,286.60 549.00,293.40" fill="#991b1b"/><text x="720.0" y="96" font-size="12" fill="#111827" text-anchor="start" font-weight="bold">4. It cannot move</text><line x1="706" y1="320.0" x2="870.0" y2="320.0" stroke="#111827" stroke-width="1.6"/><rect x="720.00" y="300.00" width="46.00" height="20.00" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.0"/><rect x="720.00" y="280.00" width="46.00" height="20.00" fill="#ffffff" stroke="#9aa0ae" stroke-width="1.0" stroke-dasharray="4 3"/><rect x="720.00" y="260.00" width="46.00" height="20.00" fill="#e5e7eb" stroke="#4b5563" stroke-width="1.0"/><rect x="720.00" y="240.00" width="46.00" height="20.00" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.0"/><rect x="720.00" y="220.00" width="46.00" height="20.00" fill="#e5e7eb" stroke="#4b5563" stroke-width="1.0"/><rect x="720.00" y="200.00" width="46.00" height="20.00" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.0"/><rect x="720.00" y="180.00" width="46.00" height="20.00" fill="#e5e7eb" stroke="#4b5563" stroke-width="1.0"/><text x="720.0" y="342.0" font-size="9.5" fill="#4b5563" text-anchor="start" font-weight="normal">Sandwiched top, bottom and sides.</text><rect x="766.00" y="280.00" width="104.00" height="20.00" fill="#fca5a5" stroke="#991b1b" stroke-width="1.1"/><text x="818.0" y="294.0" font-size="9.5" fill="#991b1b" text-anchor="middle" font-weight="normal">base plate</text><text x="86.0" y="306.0" font-size="10" fill="#1d4ed8" text-anchor="start" font-weight="normal">wall A</text><text x="86.0" y="286.0" font-size="10" fill="#4b5563" text-anchor="start" font-weight="normal">wall B</text><text x="86.0" y="266.0" font-size="10" fill="#1d4ed8" text-anchor="start" font-weight="normal">wall A</text><text x="316.0" y="294.0" font-size="10" fill="#9aa0ae" text-anchor="start" font-weight="normal">empty</text><text x="776.0" y="274.0" font-size="9.5" fill="#15803d" text-anchor="start" font-weight="normal">trapped above</text><text x="776.0" y="314.0" font-size="9.5" fill="#15803d" text-anchor="start" font-weight="normal">trapped below</text><text x="776.0" y="324.0" font-size="9.5" fill="#15803d" text-anchor="start" font-weight="normal">walls block the sides</text><text x="30" y="378" font-size="10.5" fill="#4b5563" text-anchor="start" font-weight="normal">The four walls lock together at the corners with interlocking fingers. Up each corner that makes a stack of</text><text x="30" y="396" font-size="10.5" fill="#4b5563" text-anchor="start" font-weight="normal">little blocks, alternating which wall owns them. Leave one block out of the stack and you get a slot.</text><text x="30" y="414" font-size="10.5" fill="#4b5563" text-anchor="start" font-weight="normal">The base plate has a tab at each of its four corners that is exactly block-sized. Drop it into the slot and it is</text><text x="30" y="432" font-size="10.5" fill="#4b5563" text-anchor="start" font-weight="normal">sandwiched: the block below stops it dropping, the block above stops it rising, the walls stop it sliding.</text><text x="20" y="434" font-size="9.5" fill="#9aa0ae" text-anchor="start" font-weight="normal">The walls carry on down past the slot to the floor, which is why the case sits flat.</text>
</svg>
