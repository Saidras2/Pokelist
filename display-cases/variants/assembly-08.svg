5" fill="#4b5563" text-anchor="start" font-weight="normal">Lower the lid on; the magnets self-centre it.</text><text x="24" y="350" font-size="9.5" fill="#15803d" text-anchor="start" font-weight="normal">To open: press one corner and the far corner tips.</text><text x="24" y="368" font-size="9.5" fill="#15803d" text-anchor="start" font-weight="normal">Or hook a nail into the front rim scallop.</text><text x="20" y="386" font-size="9.5" fill="#9aa0ae" text-anchor="start" font-weight="normal">Flush lid and base - a true rectangular prism.</text>
