149.10 139.41,94.32" fill="#cbd6ea" stroke="#111827" stroke-width="0.8" stroke-linejoin="round"/><polygon points="200.00,59.34 294.88,114.12 234.29,149.10 139.41,94.32" fill="#f7f9fd" stroke="#111827" stroke-width="0.8" stroke-linejoin="round"/><line x1="217.15" y1="76.50" x2="217.15" y2="98.54" stroke="#b91c1c" stroke-width="1.6"/><polygon points="217.15,105.54 213.75,98.54 220.55,98.54" fill="#b91c1c"/><text x="24" y="300" font-size="9.5" fill="#4b5563" text-anchor="start" font-weight="normal">Lay the 5 mm foam in, drop the booster box into its</text><text x="24" y="316" font-size="9.5" fill="#4b5563" text-anchor="start" font-weight="normal">cradle, then lower the lid on. The lid is the only</text><text x="24" y="332" font-size="9.5" fill="#4b5563" text-anchor="start" font-weight="normal">magnetically held part of the whole case.</text><text x="24" y="350" font-size="9.5" fill="#15803d" text-anchor="start" font-weight="normal">To open: press one corner, or use the front rim scallop.</text><text x="20" y="386" font-size="9.5" fill="#9aa0ae" text-anchor="start" font-weight="normal">Flush lid and flush base - a true rectangular prism.</text>
