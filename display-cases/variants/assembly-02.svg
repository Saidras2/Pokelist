<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" font-family="Helvetica, Arial, sans-serif">
<rect width="400" height="400" fill="#ffffff"/>
<text x="20" y="28" font-size="15" fill="#111827" text-anchor="start" font-weight="bold">STEP 2 &#183; Drill the 16 magnet pockets</text><text x="20" y="46" font-size="10.5" fill="#4b5563" text-anchor="start" font-weight="normal">Brad-point bit, ~500 rpm, panel clamped to a backer board.</text><line x1="20" y1="58" x2="380" y2="58" stroke="#e5e7eb"/>
<rect x="40.00" y="76.00" width="215.80" height="175.50" fill="#f7f9fd" stroke="#111827" stroke-width="0.8"/><rect x="139.90" y="77.00" width="16.00" height="10.00" fill="#fca5a5" stroke="#991b1b" stroke-width="1.2"/><rect x="139.90" y="240.50" width="16.00" height="10.00" fill="#fca5a5" stroke="#991b1b" stroke-width="1.2"/><line x1="40.0" y1="267.5" x2="255.8" y2="267.5" stroke="#15803d" stroke-width="1" stroke-dasharray="3 2"/><text x="147.9" y="279.5" font-size="9.5" fill="#15803d" text-anchor="middle" font-weight="normal">166 mm  (16.6 cm)</text><line x1="24.0" y1="76.0" x2="24.0" y2="251.5" stroke="#15803d" stroke-width="1" stroke-dasharray="3 2"/><text x="24.0" y="159.75" font-size="9.5" fill="#15803d" text-anchor="middle" font-weight="normal">135 mm</text><text x="269.8" y="90.0" font-size="10" fill="#4b5563" text-anchor="start" font-weight="normal">8 mm</text><text x="269.8" y="104.0" font-size="10" fill="#4b5563" text-anchor="start" font-weight="normal">thick</text><text x="269.8" y="126.0" font-size="10" fill="#b91c1c" text-anchor="start" font-weight="bold">pocket:</text><text x="269.8" y="142.0" font-size="10" fill="#4b5563" text-anchor="start" font-weight="normal">4 mm dia &#215; 2 mm</text><text x="269.8" y="156.0" font-size="10" fill="#4b5563" text-anchor="start" font-weight="normal">deep, centred, so</text><text x="269.8" y="170.0" font-size="10" fill="#4b5563" text-anchor="start" font-weight="normal">2 mm of acrylic</text><text x="269.8" y="184.0" font-size="10" fill="#4b5563" text-anchor="start" font-weight="normal">is left each side.</text><text x="40.0" y="351.5" font-size="9.5" fill="#4b5563" text-anchor="start" font-weight="normal">Every wall gets 2 pockets; each plate gets 4.</text><text x="40.0" y="367.5" font-size="9.5" fill="#4b5563" text-anchor="start" font-weight="normal">Do it while the panels are flat, not after.</text><text x="20" y="386" font-size="9.5" fill="#9aa0ae" text-anchor="start" font-weight="normal">Radius every internal corner R2 - that is where cracks start.</text>
</svg>
