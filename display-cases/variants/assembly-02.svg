<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" font-family="Helvetica, Arial, sans-serif">
<rect width="400" height="400" fill="#ffffff"/>
<text x="20" y="28" font-size="15" fill="#111827" text-anchor="start" font-weight="bold">STEP 2 &#183; Drill the 8 magnet pockets</text><text x="20" y="46" font-size="10.5" fill="#4b5563" text-anchor="start" font-weight="normal">Brad-point bit, ~500 rpm, panel clamped to a backer board.</text><line x1="20" y1="58" x2="380" y2="58" stroke="#e5e7eb"/>
<rect x="40.00" y="76.00" width="215.80" height="175.50" fill="#f7f9fd" stroke="#111827" stroke-width="0.8"/><rect x="139.90" y="79.00" width="16.00" height="10.00" fill="#fca5a5" stroke="#991b1b" stroke-width="1.2"/><line x1="40.0" y1="269.5" x2="255.8" y2="269.5" stroke="#15803d" stroke-width="1" stroke-dasharray="3 2"/><text x="147.9" y="281.5" font-size="9.5" fill="#15803d" text-anchor="middle" font-weight="normal">166 mm  (16.6 cm)</text><line x1="22.0" y1="76.0" x2="22.0" y2="251.5" stroke="#15803d" stroke-width="1" stroke-dasharray="3 2"/><text x="22.0" y="159.75" font-size="9.5" fill="#15803d" text-anchor="middle" font-weight="normal">135 mm</text><text x="269.8" y="92.0" font-size="10" fill="#4b5563" text-anchor="start" font-weight="normal">8 mm</text><text x="269.8" y="106.0" font-size="10" fill="#4b5563" text-anchor="start" font-weight="normal">thick</text><text x="269.8" y="128.0" font-size="10" fill="#b91c1c" text-anchor="start" font-weight="bold">Pocket:</text><text x="269.8" y="144.0" font-size="10" fill="#4b5563" text-anchor="start" font-weight="normal">4 mm dia &#215; 2 mm</text><text x="269.8" y="158.0" font-size="10" fill="#4b5563" text-anchor="start" font-weight="normal">deep, centred, so</text><text x="269.8" y="172.0" font-size="10" fill="#4b5563" text-anchor="start" font-weight="normal">2 mm of acrylic</text><text x="269.8" y="186.0" font-size="10" fill="#4b5563" text-anchor="start" font-weight="normal">is left each side.</text><text x="40.0" y="351.5" font-size="9.5" fill="#4b5563" text-anchor="start" font-weight="normal">One pocket in the top edge of each wall; four in the lid plate.</text><text x="40.0" y="367.5" font-size="9.5" fill="#15803d" text-anchor="start" font-weight="normal">The base needs no pockets at all - that joint is mechanical.</text><text x="20" y="386" font-size="9.5" fill="#9aa0ae" text-anchor="start" font-weight="normal">Only the top is magnetic. Radius every pocket rim R2.</text>
</svg>
