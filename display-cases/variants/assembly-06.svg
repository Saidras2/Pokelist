<text x="20" y="28" font-size="15" fill="#111827" text-anchor="start" font-weight="bold">STEP 6 &#183; Front wall in - one move, two corners</text><text x="20" y="46" font-size="10.5" fill="#4b5563" text-anchor="start" font-weight="normal">A slide along the wall's length jams at the second corner. Across it, both mesh.</text><line x1="20" y1="58" x2="380" y2="58" stroke="#e5e7eb"/>
<polygon points="204.85,192.80 140.59,229.90 140.59,123.50 204.85,86.40" fill="#e3e9f4" stroke="#111827" stroke-width="0.8" stroke-linejoin="round"/><polygon points="135.74,227.10 140.59,229.90 140.59,123.50 135.74,120.70" fill="#d2dbec" stroke="#111827" stroke-width="0.8" stroke-linejoin="round"/><polygon points="200.00,83.60 204.85,86.40 140.59,123.50 135.74,120.70" fill="#f7f9fd" stroke="#111827" stroke-width="0.8" stroke-linejoin="round"/><polygon points="300.63,248.10 236.37,285.20 236.37,178.80 300.63,141.70" fill="#e3e9f4" stroke="#111827" stroke-width="0.8" stroke-linejoin="round"/><polygon points="231.52,282.40 236.37,285.20 236.37,178.80 231.52,176.00" fill="#d2dbec" stroke="#111827" stroke-width="0.8" stroke-linejoin="round"/><polygon points="295.78,138.90 300.63,141.70 236.37,178.80 231.52,176.00" fill="#f7f9fd" stroke="#111827" stroke-width="0.8" stroke-linejoin="round"/><polygon points="290.93,242.50 236.37,274.00 236.37,268.40 290.93,236.90" fill="#cfd8e8" stroke="#111827" stroke-width="0.8" stroke-linejoin="round"/><polygon points="145.44,221.50 236.37,274.00 236.37,268.40 145.44,215.90" fill="#bcc7db" stroke="#111827" stroke-width="0.8" stroke-linejoin="round"/><polygon points="200.00,184.40 290.93,236.90 236.37,268.40 145.44,215.90" fill="#eef2f9" stroke="#111827" stroke-width="0.8" stroke-linejoin="round"/><polygon points="313.97,240.40 309.12,243.20 309.12,136.80 313.97,134.00" fill="#e3e9f4" stroke="#111827" stroke-width="0.8" stroke-linejoin="round"/><polygon points="208.49,185.10 309.12,243.20 309.12,136.80 208.49,78.70" fill="#d2dbec" stroke="#111827" stroke-width="0.8" stroke-linejoin="round"/><polygon points="213.34,75.90 313.97,134.00 309.12,136.80 208.49,78.70" fill="#f7f9fd" stroke="#111827" stroke-width="0.8" stroke-linejoin="round"/><line x1="279.41" y1="136.28" x2="272.14" y2="140.48" stroke="#1d4ed8" stroke-width="1.6"/><polygon points="266.08,143.98 270.44,137.54 273.84,143.43" fill="#1d4ed8"/><text x="24" y="300" font-size="9.5" fill="#4b5563" text-anchor="start" font-weight="normal">Slide the front wall straight in along its own width.</text><text x="24" y="316" font-size="9.5" fill="#4b5563" text-anchor="start" font-weight="normal">Both corners mesh at once, because the wall travels</text><text x="24" y="332" font-size="9.5" fill="#4b5563" text-anchor="start" font-weight="normal">across its own face - not along it.</text><text x="24" y="350" font-size="9.5" fill="#15803d" text-anchor="start" font-weight="normal">The same slide drives its two hooks under the base plate.</text><text x="20" y="386" font-size="9.5" fill="#9aa0ae" text-anchor="start" font-weight="normal">You should feel it stop dead when the fingers bottom out.</text>
