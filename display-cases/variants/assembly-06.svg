<text x="20" y="28" font-size="15" fill="#111827" text-anchor="start" font-weight="bold">STEP 6 &#183; Front wall in - one move, two corners</text><text x="20" y="46" font-size="10.5" fill="#4b5563" text-anchor="start" font-weight="normal">A slide along the wall's length jams at the second corner. Across it, both mesh.</text><line x1="20" y1="58" x2="380" y2="58" stroke="#e5e7eb"/>
<polygon points="300.63,248.10 236.37,285.20 236.37,279.60 300.63,242.50" fill="#cfd8e8" stroke="#111827" stroke-width="0.8" stroke-linejoin="round"/><polygon points="135.74,227.10 236.37,285.20 236.37,279.60 135.74,221.50" fill="#bcc7db" stroke="#111827" stroke-width="0.8" stroke-linejoin="round"/><polygon points="200.00,184.40 300.63,242.50 236.37,279.60 135.74,221.50" fill="#eef2f9" stroke="#111827" stroke-width="0.8" stroke-linejoin="round"/><polygon points="204.85,187.20 140.59,224.30 140.59,129.80 204.85,92.70" fill="#e3e9f4" stroke="#111827" stroke-width="0.8" stroke-linejoin="round"/><polygon points="135.74,221.50 140.59,224.30 140.59,129.80 135.74,127.00" fill="#d2dbec" stroke="#111827" stroke-width="0.8" stroke-linejoin="round"/><polygon points="200.00,89.90 204.85,92.70 140.59,129.80 135.74,127.00" fill="#f7f9fd" stroke="#111827" stroke-width="0.8" stroke-linejoin="round"/><polygon points="300.63,242.50 236.37,279.60 236.37,185.10 300.63,148.00" fill="#e3e9f4" stroke="#111827" stroke-width="0.8" stroke-linejoin="round"/><polygon points="231.52,276.80 236.37,279.60 236.37,185.10 231.52,182.30" fill="#d2dbec" stroke="#111827" stroke-width="0.8" stroke-linejoin="round"/><polygon points="295.78,145.20 300.63,148.00 236.37,185.10 231.52,182.30" fill="#f7f9fd" stroke="#111827" stroke-width="0.8" stroke-linejoin="round"/><polygon points="313.97,234.80 309.12,237.60 309.12,143.10 313.97,140.30" fill="#e3e9f4" stroke="#111827" stroke-width="0.8" stroke-linejoin="round"/><polygon points="208.49,179.50 309.12,237.60 309.12,143.10 208.49,85.00" fill="#d2dbec" stroke="#111827" stroke-width="0.8" stroke-linejoin="round"/><polygon points="213.34,82.20 313.97,140.30 309.12,143.10 208.49,85.00" fill="#f7f9fd" stroke="#111827" stroke-width="0.8" stroke-linejoin="round"/><line x1="279.41" y1="140.19" x2="272.14" y2="144.39" stroke="#1d4ed8" stroke-width="1.6"/><polygon points="266.08,147.89 270.44,141.44 273.84,147.33" fill="#1d4ed8"/><text x="24" y="300" font-size="9.5" fill="#4b5563" text-anchor="start" font-weight="normal">Slide the front wall straight in along its own width.</text><text x="24" y="316" font-size="9.5" fill="#4b5563" text-anchor="start" font-weight="normal">Both corners mesh at once, because the wall travels</text><text x="24" y="332" font-size="9.5" fill="#4b5563" text-anchor="start" font-weight="normal">across its own face - not along it.</text><text x="24" y="350" font-size="9.5" fill="#15803d" text-anchor="start" font-weight="normal">The same slide drives its two hooks under the base plate.</text><text x="20" y="386" font-size="9.5" fill="#9aa0ae" text-anchor="start" font-weight="normal">You should feel it stop dead when the fingers bottom out.</text>
